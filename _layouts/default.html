<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <aside class="site-sidebar" aria-label="Main navigation">
      <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      {% if site.description %}
        <p class="site-description">{{ site.description }}</p>
      {% endif %}

      <nav class="site-nav">
        <ul>
          <li>
            <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
          </li>
          <li>
            <a href="{{ '/about' | relative_url }}"{% if page.url == '/about/' or page.url == '/about.html' %} aria-current="page"{% endif %}>About</a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="site-content">
      {{ content }}
    </main>
  </body>
</html>
